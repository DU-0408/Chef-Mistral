name: Deploy Chef Qwen to k3s Homelab

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase owner name
        id: prep
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER@L}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/chef-qwen-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/chef-qwen-frontend:latest
          build-args: |
            BACKEND_URL=${{ secrets.BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k3s Homelab
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Target Namespace Exists
        run: kubectl apply -f k8s/namespace.yml

      - name: Inject Application Secrets dynamically
        run: |
          kubectl create secret generic chef-qwen-secret \
            --namespace=qchef \
            --from-literal=HF_ACCESS_TOKEN="${{ secrets.HF_ACCESS_TOKEN }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests and Trigger Restart
        run: |
          # Update OWNER placeholder in manifests dynamically to lowercase repository owner
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s/OWNER/$OWNER_LOWER/g" k8s/backend.yml k8s/frontend.yml
          
          # Apply manifests directly using local kubectl
          kubectl apply -f k8s/
          
          # Trigger rolling restart to pull newly built latest images
          kubectl rollout restart deployment/backend deployment/frontend -n qchef
